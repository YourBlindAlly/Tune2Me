name: Build and upload to TestFlight

# Produces a REAL, code-signed .ipa and uploads it straight to App Store
# Connect / TestFlight. Separate from build-unsigned-ipa.yml (which stays
# exactly as-is for the free sideloading path) since a TestFlight upload is
# a deliberate, reviewed action, not something that should happen on every
# push. Manually triggered only.
#
# Needs six repo secrets (set up under Settings > Secrets and variables >
# Actions once a Tune2Me App ID + provisioning profile exist):
#   IOS_DISTRIBUTION_CERTIFICATE_P12       - base64 of the .p12 (cert + key)
#   IOS_DISTRIBUTION_CERTIFICATE_PASSWORD  - the password that .p12 was made with
#   IOS_PROVISIONING_PROFILE               - base64 of the .mobileprovision
#   APP_STORE_CONNECT_API_KEY_P8           - base64 of the AuthKey_*.p8 file
#   APP_STORE_CONNECT_KEY_ID               - that key's Key ID
#   APP_STORE_CONNECT_ISSUER_ID            - the team's Issuer ID
# The distribution cert and App Store Connect API key are account-scoped,
# so the same ones already used for LyriCue can likely be reused as-is.
# The provisioning profile CANNOT be reused — it's bound to LyriCue's own
# bundle ID, so a new profile scoped to com.rustyperez.tune2me is required.
# See signing/ (local, gitignored) for where these come from.

on:
  workflow_dispatch: {}

env:
  CI: true
  DEVELOPMENT_TEAM: "9F3Q5GAA25"
  PROVISIONING_PROFILE_NAME: "Tune2Me App Store Distribution"

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"

      - name: Install JS dependencies
        run: npm ci

      # Real code signing needs the distribution certificate + private key
      # sitting in a keychain, and the provisioning profile in the standard
      # location Xcode looks for it — all decoded from repo secrets straight
      # into this throwaway CI runner, never touching git history.
      - name: Import signing certificate and provisioning profile
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychain -d user -s build.keychain login.keychain
          rm cert.p12

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/Tune2Me.mobileprovision

      - name: Prebuild native iOS project
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: npx expo prebuild --platform ios --non-interactive

      - name: Find workspace and scheme
        id: find
        run: |
          workspace=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n1)
          project=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -n1)
          scheme=$(xcodebuild -list -project "$project" -json | \
            node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log(d.project.schemes[0]);")
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "Found workspace: $workspace, scheme: $scheme"

      - name: Archive (real code signing)
        run: |
          xcodebuild archive \
            -workspace "${{ steps.find.outputs.workspace }}" \
            -scheme "${{ steps.find.outputs.scheme }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Tune2Me.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"

      - name: Export App Store ipa
        run: |
          cat > exportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.rustyperez.tune2me</key>
              <string>$PROVISIONING_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Tune2Me.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          ipa_path=$(find build/export -maxdepth 1 -name "*.ipa" | head -n1)
          echo "Uploading: $ipa_path"
          xcrun altool --upload-app -f "$ipa_path" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tune2Me-testflight-ipa
          path: build/export/*.ipa
          retention-days: 30
